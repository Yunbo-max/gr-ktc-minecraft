hardware:
  gpu: rtx_3090_24gb
  inference_dtype: bfloat16
  train_quantization: nf4
  gradient_checkpointing: true
  offload_analysis_to_cpu: true

model:
  id: Qwen/Qwen3-VL-8B-Instruct
  local_path: models/Qwen3-VL-8B-Instruct
  max_new_tokens: 2048

ideas:
  state_weight_reachability:
    ranks: [1, 2, 4, 8, 16, 32, 64]
    ridge: 0.001
    probe_contexts: 32
  kv_conditioned_lora_basis:
    bases: [1, 2, 4, 8]
    rank: 8
    temperature: 1.0
  privileged_future_distillation:
    horizons: [1, 2, 4, 8]
    horizon_decay: 0.9
  latent_population:
    population_sizes: [8, 16, 32, 64]
    top_k: 8
    mutation_std: [0.0, 0.01]

tasks:
  source: data/MineExplorer-Benchmark/benchmark.jsonl
  use_all_scenarios: true
  split_by_hops: true
  split_by_difficulty: true

runtime:
  default_command: "python scripts/run_new_ideas.py --scenarios data/MineExplorer-Benchmark/benchmark.jsonl --output results/four_new_ideas.json"
  no_external_api: true

